import groovy.json.JsonSlurper

plugins { id 'base' }

group = 'team.minefed'
version = '1.20.4'

tasks.withType(Exec).configureEach { environment 'PYTHONUTF8', '1' }
if (providers.gradleProperty('rebuildSources').getOrElse('false').toBoolean()) {
    tasks.withType(Exec).configureEach { environment 'MINEFED_REBUILD_SOURCES', '1' }
}

// Independent Exec tasks preserve every upstream wrapper and plugin version.
def recipes = new JsonSlurper().parse(file('inventory/build-recipes.json'))
def pythonExecutable = providers.gradleProperty('pythonExecutable')
        .orElse(providers.environmentVariable('MINEFED_PYTHON')).getOrElse('python')
def runId = new Date().format('yyyyMMdd-HHmmss', TimeZone.getTimeZone('UTC')) + '-' + UUID.randomUUID().toString().take(8)
def runner = { List<String> arguments ->
    [pythonExecutable, file('scripts/build_modpack.py').absolutePath] + arguments
}

def prepare = tasks.register('prepareModpack', Exec) {
    group = 'build'
    description = 'Validate the build plan and restore required binary-only JARs.'
    workingDir rootDir
    commandLine runner(['prepare', '--run', runId])
}

def sourceTasks = []
recipes.entries.findAll { it.mode == 'source' }.each { recipe ->
    def sourceTask = tasks.register('source_' + recipe.modId.replaceAll('[^A-Za-z0-9_]', '_'), Exec) {
        group = 'mod sources'
        description = "Build ${recipe.sourcePath} with its own Gradle wrapper."
        dependsOn prepare
        workingDir rootDir
        commandLine runner(['source', '--run', runId, '--id', recipe.modId])
    }
    // Serialize upstream builds, including when the root is invoked with --parallel.
    def predecessors = sourceTasks.toList()
    sourceTask.configure { mustRunAfter predecessors }
    sourceTasks.add(sourceTask)
}

tasks.register('modpack', Exec) {
    group = 'build'
    description = 'Build source mods and package them with pinned binary-only JARs.'
    dependsOn prepare, sourceTasks
    workingDir rootDir
    commandLine runner(['assemble', '--run', runId])
}

tasks.named('assemble') { dependsOn 'modpack' }
tasks.register('testModpackTools', Exec) {
    group = 'verification'
    workingDir rootDir
    commandLine pythonExecutable, '-m', 'unittest', 'discover', '-s', 'scripts', '-p', 'test_*.py'
}
tasks.register('verifySourceRepositories', Exec) {
    group = 'verification'
    description = 'Check Fabric repository routing with an offline upstream-policy fixture.'
    workingDir rootDir
    commandLine pythonExecutable, 'scripts/verify_source_repositories.py'
}
tasks.named('check') { dependsOn 'testModpackTools', 'verifySourceRepositories' }

tasks.register('modpackPlan', Exec) {
    group = 'help'
    description = 'Show source and binary selections without building or downloading.'
    workingDir rootDir
    commandLine runner(['plan'])
}

tasks.register('verifyBaseline', Exec) {
    group = 'verification'
    description = 'Verify the original operating-server JAR inventory.'
    workingDir rootDir
    commandLine pythonExecutable, 'scripts/mods.py', 'verify', '--sources'
}
